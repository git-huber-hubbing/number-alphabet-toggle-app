<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Number / Alphabet Toggle</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-container">
      <h1>Number / Alphabet Toggle</h1>
      <div class="display" id="display">-</div>
      <div class="mode" id="mode">Mode: Numbers</div>
      <div class="controls">
        <button id="toggle-mode">Switch to Alphabets</button>
        <button id="next-value">Next</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
